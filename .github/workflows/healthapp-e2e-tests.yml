name: Health app E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - "Exercises/TypeScript/healthapp/**"
      - "Exercises/TypeScript/healthapp-tests/**"
      - ".github/workflows/healthapp-e2e-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            Exercises/TypeScript/healthapp/package-lock.json
            Exercises/TypeScript/healthapp-tests/package-lock.json

      - name: Install healthapp dependencies
        working-directory: Exercises/TypeScript/healthapp
        run: npm ci

      - name: Lint healthapp
        working-directory: Exercises/TypeScript/healthapp
        run: npm run lint

      - name: Start healthapp server
        working-directory: Exercises/TypeScript/healthapp
        run: |
          npm start &
          echo $! > server.pid
          sleep 3

      - name: Install test dependencies
        working-directory: Exercises/TypeScript/healthapp-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Exercises/TypeScript/healthapp-tests
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: Exercises/TypeScript/healthapp-tests
        run: npm test

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: Exercises/TypeScript/healthapp-tests/playwright-report/
          retention-days: 30

      - name: Stop healthapp server
        if: always()
        working-directory: Exercises/TypeScript/healthapp
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
